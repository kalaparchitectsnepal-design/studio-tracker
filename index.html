  // ---------- Actions ----------
  function handleClick(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;

    if(action==='close-modal' && e.target===t){ closeModal(); return; }

    switch(action){
      case 'select-project':
        state.selectedProjectId = t.dataset.id;
        state.selectedMilestoneId = null;
        state.view='project';
        render();
        break;
      case 'open-team':
        state.view='team'; render();
        break;
      case 'view-person':
        state.selectedPersonId = t.dataset.id;
        state.view = 'person';
        render();
        break;
      case 'open-overview':
        state.view='overview'; render();
        break;
      case 'open-welcome':
        state.view='welcome'; render();
        break;
      case 'new-project':
        modalNewProject();
        break;
      case 'create-project': {
        const name = document.getElementById('mProjName').value.trim();
        if(!name) return;
        const client = document.getElementById('mProjClient').value.trim();
        const p = {id:uid(), name, client, status:'Active'};
        state.projects.push(p);
        state.selectedProjectId = p.id;
        state.view='project';
        saveProjects();
        closeModal(); render();
        break;
      }
      case 'set-project-status': break; // handled on change
      case 'new-milestone':
        modalNewMilestone(t.dataset.project);
        break;
      case 'create-milestone': {
        const name = document.getElementById('mMsName').value.trim();
        const due = document.getElementById('mMsDue').value;
        if(!name || !due) return;
        const m = {id:uid(), projectId:t.dataset.project, name, dueDate:due};
        state.milestones.push(m);
        state.selectedMilestoneId = m.id;
        saveMilestones();
        closeModal(); render();
        break;
      }
      case 'request-delete':
        modalConfirmDelete(t.dataset.type, t.dataset.id, t.dataset.label || 'this item');
        break;
      case 'confirm-delete': {
        const pd = state.pendingDelete;
        if(!pd) { closeModal(); break; }
        if(pd.type==='milestone'){
          state.milestones = state.milestones.filter(m=>m.id!==pd.id);
          state.tasks = state.tasks.filter(ts=>ts.milestoneId!==pd.id);
          state.events = state.events.filter(ev=>ev.milestoneId!==pd.id);
          if(state.selectedMilestoneId===pd.id) state.selectedMilestoneId=null;
          saveMilestones(); saveTasks(); saveEvents();
        } else if(pd.type==='task'){
          state.tasks = state.tasks.filter(x=>x.id!==pd.id);
          saveTasks();
        } else if(pd.type==='revision'){
          state.revisions = state.revisions.filter(r=>r.id!==pd.id);
          saveRevisions();
        } else if(pd.type==='event'){
          state.events = state.events.filter(ev=>ev.id!==pd.id);
          saveEvents();
        } else if(pd.type==='project'){
          const msIds = state.milestones.filter(m=>m.projectId===pd.id).map(m=>m.id);
          state.projects = state.projects.filter(pr=>pr.id!==pd.id);
          state.milestones = state.milestones.filter(m=>m.projectId!==pd.id);
          state.tasks = state.tasks.filter(ts=>!msIds.includes(ts.milestoneId));
          state.events = state.events.filter(ev=>!msIds.includes(ev.milestoneId));
          state.revisions = state.revisions.filter(r=>r.projectId!==pd.id);
          if(state.selectedProjectId===pd.id){
            state.selectedProjectId = state.projects.length ? state.projects[0].id : null;
          }
          state.selectedMilestoneId = null;
          saveProjects(); saveMilestones(); saveTasks(); saveEvents(); saveRevisions();
        }
        state.pendingDelete = null;
        closeModal(); render();
        break;
      }
      case 'select-milestone':
        state.selectedMilestoneId = (state.selectedMilestoneId === t.dataset.id) ? null : t.dataset.id;
        render();
        break;
      case 'close-milestone-panel':
        state.selectedMilestoneId = null;
        render();
        break;
      case 'remove-assignee': {
        const task = state.tasks.find(x=>x.id===t.dataset.id);
        if(task && Array.isArray(task.assignees)){
          task.assignees = task.assignees.filter(id=>id!==t.dataset.member);
          saveTasks(); render();
        }
        break;
      }
      case 'toggle-task-group':
        state.expandedTaskGroups[t.dataset.key] = !state.expandedTaskGroups[t.dataset.key];
        render();
        break;
      case 'add-task': {
        const titleEl = document.getElementById('newTaskTitle');
        const title = titleEl.value.trim();
        if(!title) return;
        const assignee = document.getElementById('newTaskAssignee').value;
        const due = document.getElementById('newTaskDue').value;
        const status = document.getElementById('newTaskStatus').value;
        state.tasks.push({id:uid(), milestoneId:t.dataset.milestone, title, assignees: assignee ? [assignee] : [], dueDate:due, status});
        saveTasks();
        render();
        break;
      }
      case 'new-revision':
        modalNewRevision(t.dataset.project);
        break;
      case 'create-revision': {
        const title = document.getElementById('mRevTitle').value.trim();
        const date = document.getElementById('mRevDate').value;
        if(!title || !date) return;
        const source = document.getElementById('mRevSource').value;
        const milestoneId = document.getElementById('mRevMilestone').value;
        const delayDays = document.getElementById('mRevDelay').value;
        const notes = document.getElementById('mRevNotes').value.trim();
        state.revisions.push({
          id: uid(), projectId: t.dataset.project, title, date, source,
          milestoneId: milestoneId || '', delayDays: delayDays ? Number(delayDays) : 0, notes, resolved: false
        });
        saveRevisions();
        closeModal(); render();
        break;
      }
      case 'edit-revision': {
        const rev = state.revisions.find(x=>x.id===t.dataset.id);
        if(rev) modalNewRevision(rev.projectId, rev);
        break;
      }
      case 'update-revision': {
        const rev = state.revisions.find(x=>x.id===t.dataset.id);
        if(!rev) return;
        const title = document.getElementById('mRevTitle').value.trim();
        const date = document.getElementById('mRevDate').value;
        if(!title || !date) return;
        rev.title = title;
        rev.date = date;
        rev.source = document.getElementById('mRevSource').value;
        rev.milestoneId = document.getElementById('mRevMilestone').value || '';
        const delayDays = document.getElementById('mRevDelay').value;
        rev.delayDays = delayDays ? Number(delayDays) : 0;
        rev.notes = document.getElementById('mRevNotes').value.trim();
        saveRevisions();
        closeModal(); render();
        break;
      }
      case 'new-event':
        modalNewEvent(t.dataset.milestone);
        break;
      case 'create-event': {
        const title = document.getElementById('mEvTitle').value.trim();
        const date = document.getElementById('mEvDate').value;
        if(!title || !date) return;
        const type = document.getElementById('mEvType').value;
        const notes = document.getElementById('mEvNotes').value.trim();
        state.events.push({id:uid(), milestoneId:t.dataset.milestone, title, type, date, notes});
        saveEvents();
        closeModal(); render();
        break;
      }
      case 'toggle-event-expand':
        state.expandedEvents[t.dataset.id] = !state.expandedEvents[t.dataset.id];
        render();
        break;
      case 'edit-event': {
        const ev = state.events.find(x=>x.id===t.dataset.id);
        if(ev) modalNewEvent(ev.milestoneId, ev);
        break;
      }
      case 'update-event': {
        const ev = state.events.find(x=>x.id===t.dataset.id);
        if(!ev) return;
        const title = document.getElementById('mEvTitle').value.trim();
        const date = document.getElementById('mEvDate').value;
        if(!title || !date) return;
        ev.title = title;
        ev.date = date;
        ev.type = document.getElementById('mEvType').value;
        ev.notes = document.getElementById('mEvNotes').value.trim();
        saveEvents();
        closeModal(); render();
        break;
      }
      case 'new-member':
        modalNewMember();
        break;
      case 'create-member': {
        const name = document.getElementById('mMemName').value.trim();
        if(!name) return;
        const role = document.getElementById('mMemRole').value.trim();
        const color = document.getElementById('mMemColor').value;
        const newMember = {id:uid(), name, role, color};
        state.team.push(newMember);
        saveTeam();
        if(state.pendingAssignTaskId){
          const task = state.tasks.find(x=>x.id===state.pendingAssignTaskId);
          if(task){
            if(!Array.isArray(task.assignees)) task.assignees = [];
            if(!task.assignees.includes(newMember.id)) task.assignees.push(newMember.id);
            saveTasks();
          }
          state.pendingAssignTaskId = null;
        }
        if(state.pendingIdentifyAfterCreate){
          state.currentPersonId = newMember.id;
          saveWhoami(newMember.id);
          state.pendingIdentifyAfterCreate = false;
          state.view = 'welcome';
        }
        closeModal(); render();
        break;
      }
      case 'identify-as':
        state.currentPersonId = t.dataset.id;
        saveWhoami(t.dataset.id);
        state.view = 'welcome';
        render();
        break;
      case 'identify-new':
        state.pendingIdentifyAfterCreate = true;
        modalNewMember();
        break;
      case 'identify-skip':
        state.currentPersonId = null;
        saveWhoami('__skip__');
        state.view = 'overview';
        render();
        break;
      case 'switch-identity':
        state.view = 'identify';
        render();
        break;
      case 'sign-out':
        doSignOut();
        break;
      case 'request-delete-account':
        modalDeleteAccount();
        break;
      case 'confirm-delete-account': {
        const person = state.team.find(tm=>tm.id===state.currentPersonId);
        if(person){
          state.team = state.team.filter(tm=>tm.id!==person.id);
          state.tasks.forEach(ts=>{
            if(Array.isArray(ts.assignees)) ts.assignees = ts.assignees.filter(id=>id!==person.id);
          });
          saveTeam(); saveTasks();
        }
        closeModal();
        doSignOut();
        break;
      }
    }
  }

  function handleChange(e){
    if(e.target.dataset.action==='set-project-status'){
      const p = state.projects.find(x=>x.id===e.target.dataset.id);
      if(p){ p.status = e.target.value; saveProjects(); render(); }
    }
    if(e.target.dataset.action==='add-assignee'){
      if(!e.target.value) return;
      if(e.target.value==='__new__'){
        state.pendingAssignTaskId = e.target.dataset.id;
        modalNewMember();
        render(); // reset the select back to its real value underneath the modal
        return;
      }
      const task = state.tasks.find(x=>x.id===e.target.dataset.id);
      if(task){
        if(!Array.isArray(task.assignees)) task.assignees = [];
        if(!task.assignees.includes(e.target.value)) task.assignees.push(e.target.value);
        saveTasks(); render();
      }
    }
    if(e.target.dataset.action==='toggle-revision-resolved'){
      const rev = state.revisions.find(x=>x.id===e.target.dataset.id);
      if(rev){ rev.resolved = e.target.checked; saveRevisions(); render(); }
    }
    if(e.target.dataset.action==='change-task-status'){
      const task = state.tasks.find(x=>x.id===e.target.dataset.id);
      if(task){ task.status = e.target.value; saveTasks(); render(); }
    }
    if(e.target.dataset.role==='new-task-status'){
      e.target.className = 'task-status-select status-'+e.target.value;
    }
  }


  function setAuthMessage(msg, ok=false){
    const el=document.getElementById('authMessage');
    if(el){ el.textContent=msg||''; el.style.color=ok ? 'var(--green)' : 'var(--markup)'; }
  }

  async function signIn(){
    const email=document.getElementById('authEmail').value.trim();
    const password=document.getElementById('authPassword').value;
    setAuthMessage('Signing in…');
    const {error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) setAuthMessage(error.message);
  }

  async function signUp(){
    const email=document.getElementById('authEmail').value.trim();
    const password=document.getElementById('authPassword').value;
    setAuthMessage('Creating account…');
    const {data,error}=await supabaseClient.auth.signUp({
      email,password,
      options:{emailRedirectTo:window.location.href}
    });
    if(error){ setAuthMessage(error.message); return; }
    if(data.session) setAuthMessage('Account created. Signing you in…',true);
    else setAuthMessage('Account created. Check your email to confirm, then sign in.',true);
  }

  function showSignedInUI(){
    document.body.classList.remove('auth-locked');
    const root=document.getElementById('authRoot');
    if(root) root.remove();
    // No floating badge anymore — sign out / delete account now live on the Home page itself.
  }

  async function doSignOut(){
    await supabaseClient.auth.signOut();
    location.reload();
  }

  function modalDeleteAccount(){
    openModal(`
      <div class="modal" style="width:380px;">
        <div class="modal-head">Delete your account?</div>
        <div class="modal-body">
          <p style="margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.55;">This removes you from the team roster and unassigns you from every work item across every project. It can't be undone by you.</p>
          <p style="margin:0;font-size:13px;color:var(--ink-soft);line-height:1.55;">Your login itself has to be removed by whoever manages this Supabase project — that last step isn't something the app is allowed to do on its own, for security reasons. After this, tell an admin to also remove your login from Supabase (Authentication → Users) so you're fully gone.</p>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" data-action="close-modal">Cancel</button>
          <button class="btn danger" data-action="confirm-delete-account" style="border-color:var(--markup);">Delete my account</button>
        </div>
      </div>`);
  }

  function subscribeRealtime(){
    if(realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = supabaseClient
      .channel('studio-tracker-state')
      .on('postgres_changes',{event:'*',schema:'public',table:'studio_state'},async()=>{
        if(!currentAuthUser || state.saving) return;
        await loadAll();
        render();
      })
      .subscribe();
  }

  async function bootWithAuth(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){
      document.body.classList.add('auth-locked');
      document.getElementById('authForm').addEventListener('submit',e=>{e.preventDefault();signIn();});
      document.getElementById('authSignup').addEventListener('click',signUp);
      return;
    }
    currentAuthUser=session.user;
    window.storage = supabaseAdapter();
    usingLocalFallback=false;
    showSignedInUI();
    await loadAll();
    render();
    subscribeRealtime();
  }

  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    if(session && !currentAuthUser){
      currentAuthUser=session.user;
      window.storage=supabaseAdapter();
      usingLocalFallback=false;
      showSignedInUI();
      loadAll().then(render);
      subscribeRealtime();
    }
  });

  document.addEventListener('click', handleClick);
  document.addEventListener('change', handleChange);
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && e.target.id==='newTaskTitle'){
      const btn = document.querySelector('[data-action="add-task"]');
      if(btn) btn.click();
    }
  });

  bootWithAuth();
})();
</script>
</body>
</html>
